name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Capacitor 8 needs JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The android/ project is generated fresh on every build, so it is not stored in git.
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      # A rising versionCode lets a new APK install over the previous one without wiping app data.
      - name: Set version
        run: |
          grep -q 'versionCode 1$' android/app/build.gradle
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle

      - name: Check for signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Debug-signed APK::No signing secrets found. Debug APKs get a new random key on each build, so you must uninstall the old app before installing a new one, which erases your progress. See the repo README or ask Claude to set up a permanent signing key."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          KS="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$KS"
          mkdir -p out
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$KS" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out out/arabic-learner.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify out/arabic-learner.apk
          rm -f "$KS"

      - name: Build debug APK
        if: steps.signing.outputs.enabled != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/arabic-learner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: arabic-learner-apk
          path: out/arabic-learner.apk
          if-no-files-found: error
          retention-days: 30
